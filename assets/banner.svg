<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="SpoolMojo — if you can dream it, we can print it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241E3D"/>
      <stop offset="1" stop-color="#3a3358"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00CECB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00CECB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B61FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5E5B" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FF5E5B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="260" fill="url(#glow1)"/>
  <circle cx="120" cy="380" r="240" fill="url(#glow2)"/>
  <circle cx="640" cy="420" r="200" fill="url(#glow3)"/>

  <!-- filament spool -->
  <g transform="translate(930,210)">
    <!-- back flange -->
    <ellipse cx="55" cy="0" rx="26" ry="120" fill="#1a1530"/>
    <ellipse cx="55" cy="0" rx="20" ry="112" fill="#241E3D" stroke="#FFF8F0" stroke-width="4"/>
    <!-- windings -->
    <g fill="none" stroke="#FF5E5B" stroke-width="14" stroke-linecap="round">
      <path d="M -52 -86 A 24 86 0 0 0 -52 86"/>
      <path d="M -24 -86 A 24 86 0 0 0 -24 86"/>
      <path d="M 4 -86 A 24 86 0 0 0 4 86"/>
      <path d="M 32 -86 A 24 86 0 0 0 32 86"/>
    </g>
    <g fill="none" stroke="#e94b48" stroke-width="14" stroke-linecap="round" opacity="0.85">
      <path d="M -38 -86 A 24 86 0 0 1 -38 86"/>
      <path d="M -10 -86 A 24 86 0 0 1 -10 86"/>
      <path d="M 18 -86 A 24 86 0 0 1 18 86"/>
    </g>
    <!-- front flange -->
    <ellipse cx="-72" cy="0" rx="30" ry="124" fill="#1a1530"/>
    <ellipse cx="-72" cy="0" rx="24" ry="116" fill="#241E3D" stroke="#FFF8F0" stroke-width="5"/>
    <ellipse cx="-72" cy="0" rx="9" ry="42" fill="#3a3358" stroke="#FFF8F0" stroke-width="4"/>
    <!-- filament tail -->
    <path d="M 60 -80 C 150 -140, 210 -60, 195 30 C 185 85, 130 110, 95 96"
          fill="none" stroke="#FF5E5B" stroke-width="13" stroke-linecap="round"/>
    <circle cx="95" cy="96" r="10" fill="#FFED66"/>
  </g>

  <!-- wordmark -->
  <g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif">
    <rect x="72" y="88" rx="17" width="270" height="34" fill="#FFED66"/>
    <text x="88" y="112" font-size="17" font-weight="bold" fill="#241E3D" letter-spacing="2">✦ CUSTOM-MADE FOR YOU</text>
    <text x="70" y="196" font-size="72" font-weight="bold" fill="#FFF8F0">Spool<tspan fill="#FF5E5B">Mojo</tspan></text>
    <text x="74" y="248" font-size="26" fill="#FFF8F0" opacity="0.92">If you can dream it, we can print it.</text>
    <text x="74" y="284" font-size="17" fill="#FFF8F0" opacity="0.65">Custom 3D-printed gifts · décor · toys · mounts · spare parts · prototypes</text>
    <!-- buttons -->
    <rect x="74" y="316" rx="24" width="196" height="48" fill="#FF5E5B"/>
    <text x="102" y="347" font-size="18" font-weight="bold" fill="#FFF8F0">Start a project</text>
    <rect x="286" y="316" rx="24" width="188" height="48" fill="none" stroke="#00CECB" stroke-width="3"/>
    <text x="312" y="347" font-size="18" font-weight="bold" fill="#00CECB">See the site →</text>
  </g>
</svg>
